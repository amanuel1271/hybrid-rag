name: llm-eval

# The Qwen evals (answer quality + prompt injection) on a CI runner instead of a laptop.
# Slow (~15-25 min on CPU), so it runs on pull requests and on demand, not on every push to main.
on:
  pull_request:
  workflow_dispatch:

jobs:
  llm-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      FASTEMBED_CACHE_PATH: /home/runner/models
      OLLAMA_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: /home/runner/models
          key: models-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-nli-deberta-v3-xsmall
      - uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-3b
      - run: pip install -r requirements.txt
      - name: start Ollama with qwen2.5:3b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 30); do curl -sf $OLLAMA_URL/api/tags && break; sleep 1; done
          ollama pull qwen2.5:3b
      - name: answer quality (golden.json, Qwen behind the claim check)
        shell: bash
        run: python eval.py --llm | tee -a "$GITHUB_STEP_SUMMARY"
      - name: prompt injection (planted attacks)
        shell: bash
        run: python eval_injection.py | tee -a "$GITHUB_STEP_SUMMARY"
