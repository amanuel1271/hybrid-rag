services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rag"]
      interval: 2s
      retries: 15

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      OLLAMA_URL: http://host.docker.internal:11434   # Ollama on the host; unreachable -> extractive answers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
